<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Emmanuel Blas Roberto">
    <meta name="author" content="Emmanuel Blas Roberto">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        
        <form action="review.html" method="get">
            
            <!-- Product Name Dropdown -->
            <div class="form-item">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-item rating-group">
                <legend>Overall Rating</legend>
                <div class="stars-container">
                    <div class="star-item">
                        <label for="rating-1">☆</label>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                    </div>
                    <div class="star-item">
                        <label for="rating-2">☆☆</label>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                    </div>
                    <div class="star-item">
                        <label for="rating-3">☆☆☆</label>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                    </div>
                    <div class="star-item">
                        <label for="rating-4">☆☆☆☆</label>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                    </div>
                    <div class="star-item">
                        <label for="rating-5">☆☆☆☆☆</label>
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-item">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-item checkbox-group">
                <legend>Which features did you find useful in the product? <br><em>(Check all that apply)</em></legend>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                    <label for="feature-ease">Ease of Use</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design</label>
                </div>
            </fieldset> 
            
            <!-- Written Review (Optional) -->
            <div class="form-item">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            <!-- User Name (Optional) -->
            <div class="form-item">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="year"></span> Emmanuel Blas Roberto<br>Philippines</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>
</html>
